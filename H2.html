 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Live Streaming - TG @FinallyLive</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.4/dist/controls.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg-color: #05070e;
    --primary: #6366f1;
    --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    --telegram: #0088cc;
    --telegram-gradient: linear-gradient(135deg, #00a8ff 0%, #0077b6 100%);
    --card-bg: rgba(18, 24, 38, 0.7);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-white: #f8fafc;
    --text-dim: #94a3b8;
    --live-red: #ef4444;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-color);
    background-image: 
        radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(147, 51, 234, 0.08) 0%, transparent 40%);
    color: var(--text-white);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 12px;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding-bottom: 2rem;
}

/* =========================
   TOP LIVE BAR
========================= */
.stream-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 12px 4px;
}

.live-badge-group {
    display: flex;
    align-items: center;
    gap: 8px;
}

.badge-live {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.badge-live::before {
    content: '';
    width: 7px;
    height: 7px;
    background: var(--live-red);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--live-red);
    animation: livePulse 1.4s infinite;
}

@keyframes livePulse {
    0% { transform: scale(0.95); opacity: 0.6; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.6; }
}

.live-viewers {
    font-size: 0.8rem;
    color: var(--text-dim);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 5px;
}

.quality-tag {
    font-size: 0.75rem;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-color);
    padding: 2px 8px;
    border-radius: 6px;
    color: #38bdf8;
    font-weight: 700;
}

/* =========================
   PLAYER WRAPPER
========================= */
.player-wrapper {
    position: relative;
    border-radius: 20px;
    padding: 1px;
    background: linear-gradient(180deg, rgba(99, 102, 241, 0.3) 0%, rgba(255, 255, 255, 0.05) 100%);
    box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.8), 0 0 30px -10px rgba(99, 102, 241, 0.25);
    overflow: hidden;
}

#player-container {
    width: 100%;
    aspect-ratio: 16/9;
    background-color: #000;
    border-radius: 19px;
    overflow: hidden;
}

/* =========================
   QUICK ACTION BUTTONS
========================= */
.quick-actions {
    display: grid;
    grid-template-columns: 1.5fr 1fr 50px;
    gap: 10px;
    margin-top: 14px;
}

.action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 0.9rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap;
}

/* =========================
   STREAM INFO CARD
========================= */
.stream-info-box {
    margin-top: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.stream-details h3 {
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff;
}

.stream-details p {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 2px;
}

.refresh-stream-btn {
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.25);
    color: #a5b4fc;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
}

.refresh-stream-btn:hover {
    background: rgba(99, 102, 241, 0.25);
    color: #fff;
}

/* Back Link */
.back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 20px auto 0;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: 0.2s;
}

.back-link:hover {
    color: #fff;
}

.popup-actions {

    background: var(--telegram-gradient);
    color: #fff;

    box-shadow: 0 8px 20px -3px rgba(0, 168, 255, 0.5);
}

.popup-close-action {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 10px;
    font-size: 0.82rem;

}

.popup-close-action:hover {

}

/* Responsive adjustments */
@media (max-width: 480px) {
    .quick-actions {
        grid-template-columns: 1fr 1fr;
    }
    .action-btn.icon-only {
        display: none;
    }
}
</style>
</head>

<body>

<main class="container">
    <!-- Stream Live Header -->
    <div class="stream-header">
        <div class="live-badge-group">
            <div class="badge-live">Live</div>
            <div class="live-viewers">
                <i class="fa-solid fa-user-group" style="font-size: 0.75rem;"></i>
                <span id="viewersCount">1,480</span> watching
            </div>
        </div>
        <div class="quality-tag">1080p 60fps</div>
    </div>

    <!-- Video Player with Ambient Glow -->
    <div class="player-wrapper">
        <div id="player-container">
            <iframe
                id="streamFrame"
                src="https://finallylivestream.pages.dev/willow"
                style="width: 100%; height: 100%; border: 0;"
                allow="encrypted-media; autoplay"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Smart Action Row -->
    <div class="quick-actions">
 <a href="https://t.me/Finally_Live_Streaming" target="_blank" class="action-btn primary-tg">
            <i class="fa-brands fa-telegram"></i> Join Updates
        </a>
        <button class="action-btn secondary-share" id="shareButton">
            <i class="fa-solid fa-share-nodes"></i> Share
        </button>
        <button class="action-btn icon-only" title="Reload Player" onclick="reloadPlayer()">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </div>

    <!-- Live Stream Information Banner -->
    <div class="stream-info-box">
        <div class="stream-details">
            <h3>Finally Live HD Stream</h3>
            <p>If video buffers or stops, tap reload</p>
        </div>
        <button class="refresh-stream-btn" onclick="reloadPlayer()">
            <i class="fa-solid fa-rotate"></i> Reload
        </button>
    </div>
<!-- Back to Streams -->
    <a href="#" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to All Streams
    </a>
</main>

<!-- Modern Telegram Popup -->
<div class="modal-overlay" id="telegramModal">
    <div class="telegram-popup">
        <button class="close-btn" id="closeModalBtn" aria-label="Close">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="popup-icon-wrapper">
            <div class="popup-icon">
                <i class="fa-brands fa-telegram"></i>
            </div>
        </div>

        <h2>Never Miss a Match!</h2>
        <p>Backup links, match scores, aur live events sabse pehle paane ke liye <span>@FinallyLive</span> join karein.</p>

        <div class="popup-actions">
            <a href="https://t.me/Finally_Live_Streaming" target="_blank" class="popup-join-btn">
                <i class="fa-brands fa-telegram"></i> Join Telegram Now
            </a>
            <button class="popup-close-action" id="alreadyJoinedBtn">
                I'm already joined
            </button>
        </div>
    </div>
</div>

<script>
// Dynamic Viewers Simulator (Thoda live touch dene ke liye)
let viewers = 1480;
setInterval(() => {
    const diff = Math.floor(Math.random() * 11) - 5;
    viewers += diff;
    const el = document.getElementById('viewersCount');
    if (el) el.textContent = viewers.toLocaleString();
}, 4000);

// Reload stream function
function reloadPlayer() {
    const frame = document.getElementById('streamFrame');
    if(frame) {
        const src = frame.src;
        frame.src = '';
        setTimeout(() => { frame.src = src; }, 150);
    }
}

// Modal handling
const modal = document.getElementById('telegramModal');
const closeModalBtn = document.getElementById('closeModalBtn');
const alreadyJoinedBtn = document.getElementById('alreadyJoinedBtn');

const hideModal = () => modal.classList.remove('active');

closeModalBtn.addEventListener('click', hideModal);
alreadyJoinedBtn.addEventListener('click', hideModal);
modal.addEventListener('click', (e) => {
    if (e.target === modal) hideModal();
});

// Popup show after 2.5 seconds
setTimeout(() => {
    modal.classList.add('active');
}, 2000);

// Share / Copy Link handling
const shareBtn = document.getElementById('shareButton');
shareBtn.addEventListener('click', async () => {
    const originalText = shareBtn.innerHTML;

    try {
        await navigator.clipboard.writeText(window.location.href);
        shareBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        shareBtn.classList.add('copied');

        setTimeout(() => {
            shareBtn.innerHTML = originalText;
            shareBtn.classList.remove('copied');
        }, 2000);
    } catch {
        alert('Stream URL: ' + window.location.href);
    }
});
</script>

</body>
</html>
