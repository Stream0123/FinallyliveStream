<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TG_@FinallyLive</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-color: #070b19;
    --card-bg: #0f172a;
    --card-border: rgba(255, 255, 255, 0.08);
    --primary-blue: #0088cc;
    --primary-purple: #4f46e5;
    --text-white: #f8fafc;
    --text-muted: #94a3b8;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-white);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 14px 12px;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

/* =========================
   TOP STATUS BADGE
========================= */
.top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
}

.live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #ef4444;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.live-dot {
    width: 6px;
    height: 6px;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 6px #ef4444;
}

.channel-tag {
    font-size: 0.8rem;
    font-weight: 600;
    color: #38bdf8;
}

/* =========================
   VIDEO PLAYER
========================= */
.player-wrapper {
    width: 100%;
    aspect-ratio: 16/9;
    background-color: #000;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--card-border);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
}

.player-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

/* =========================
   ACTION BUTTONS
========================= */
.buttons-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 14px;
}

.action-btn {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 16px;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 12px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
}

.action-btn:active {
    transform: scale(0.98);
}

.telegram-btn {
    background: linear-gradient(135deg, #0088cc 0%, #0077b5 100%);
    color: #ffffff;
    box-shadow: 0 6px 18px rgba(0, 136, 204, 0.35);
}

.share-btn {
    background: #0f172a;
    color: var(--text-white);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

.share-btn.copied {
    background: #10b981;
    border-color: #10b981;
    color: #ffffff;
}

/* Back Link */
.back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 22px;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-decoration: none;
    font-weight: 500;
}

.back-link:hover {
    color: var(--text-white);
}
/* ====================================
   FIXED MODAL POPUP (CENTER ALIGNED)
==================================== */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(4, 7, 18, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    padding: 20px;
}

.modal-overlay.active {
    display: flex;
}

.modal-card {
    position: relative;
    width: 100%;
    max-width: 320px;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    padding: 24px 20px 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 136, 204, 0.3);
    animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes modalScale {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.modal-close-icon {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: none;
    color: var(--text-muted);
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.modal-tg-logo {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0088cc, #00a8ff);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 4px auto 14px auto;
    box-shadow: 0 8px 20px rgba(0, 136, 204, 0.4);
}

.modal-card h2 {
    font-size: 1.22rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 6px;
}

.modal-card p {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.45;
    margin-bottom: 18px;
}

.modal-card p span {
    color: #38bdf8;
    font-weight: 600;
}

.popup-join-btn {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    background: linear-gradient(135deg, #0088cc 0%, #0077b5 100%);
    color: #ffffff;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(0, 136, 204, 0.35);
    border: none;
    cursor: pointer;
}

.popup-dismiss-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 12px;
    cursor: pointer;
    padding: 6px;
}

.popup-dismiss-btn:hover {
    color: #ffffff;
}
</style>
</head>

<body>

<main class="container">
    <!-- Header -->
    <div class="top-header">
        <div class="live-indicator">
            <span class="live-dot"></span> LIVE STREAM
        </div>
        <div class="channel-tag">@FinallyLive</div>
    </div>

    <!-- Video Box -->
    <div class="player-wrapper">
        <iframe
            src="https://finallylivestream.pages.dev/willow"
            allow="encrypted-media; autoplay"
            allowfullscreen>
        </iframe>
    </div>
 <!-- Quick Buttons -->
    <div class="buttons-group">
        <a href="https://t.me/Finally_Live_Streaming" target="_blank" class="action-btn telegram-btn">
            <i class="fa-brands fa-telegram"></i> Click Here To Join Telegram
        </a>

        <button class="action-btn share-btn" id="shareBtn">
            <i class="fa-solid fa-share-nodes"></i> Share Stream Link
        </button>
    </div>

    <a href="#" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to All Streams
    </a>
</main>

<!-- Centered Telegram Popup -->
<div class="modal-overlay" id="telegramModal">
    <div class="modal-card">
        <button class="modal-close-icon" id="closeModal">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="modal-tg-logo">
            <i class="fa-brands fa-telegram"></i>
        </div>

        <h2>Join Community</h2>
        <p>Live matches, backup links aur fast updates ke liye <span>@FinallyLive</span> join karein.</p>

        <a href="https://t.me/Finally_Live_Streaming" target="_blank" class="popup-join-btn">
            <i class="fa-brands fa-telegram"></i> Join Telegram Now
        </a>

        <button class="popup-dismiss-btn" id="dismissModal">
            Already Joined / Skip
        </button>
    </div>
</div>

<script>
// Modal Controls
const modal = document.getElementById('telegramModal');
const closeModal = document.getElementById('closeModal');
const dismissModal = document.getElementById('dismissModal');

function hidePopup() {
    modal.classList.remove('active');
}

closeModal.addEventListener('click', hidePopup);
dismissModal.addEventListener('click', hidePopup);

modal.addEventListener('click', (e) => {
    if (e.target === modal) hidePopup();
});

// Auto Show Modal after 2 seconds
setTimeout(() => {
    modal.classList.add('active');
}, 2000);

// Copy Link Handler
const shareBtn = document.getElementById('shareBtn');
shareBtn.addEventListener('click', async () => {
    const originalText = shareBtn.innerHTML;
    try {
        await navigator.clipboard.writeText(window.location.href);
        shareBtn.innerHTML = '<i class="fa-solid fa-check"></i> Link Copied!';
        shareBtn.classList.add('copied');

        setTimeout(() => {
            shareBtn.innerHTML = originalText;
            shareBtn.classList.remove('copied');
        }, 2000);
    } catch {
        alert('Copy link: ' + window.location.href);
    }
});
</script>

</body>
</html>
