  <style>
    /* Reset & layout fixes for mobile viewports */
    html, body {
      background-color: #000;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: sans-serif;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height for mobile browsers */
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shaka-spinner-container {
      display: none;
    }

    /* Ensure controls container stays above video and receives touch events */
    .shaka-controls-container {
      z-index: 10;
      pointer-events: auto !important;
    }

    /* Prevent control buttons from getting pushed off-screen in portrait */
    .shaka-controls-button-panel {
      display: flex !important;
      align-items: center;
      padding: 0 8px !important;
      box-sizing: border-box;
    }

    /* Custom fit/stretch/full button */
    .custom-fit-button {
      background: transparent;
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.9;
      transition: opacity 0.2s, background 0.2s;
      padding: 0;
      outline: none;
      border-radius: 4px;
      flex-shrink: 0;
      margin: 0 4px;
    }

    .custom-fit-button:hover {
      opacity: 1;
      background: rgba(255,255,255,0.15);
    }

    .custom-fit-button svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Portrait optimizations: reduce element footprint so all controls fit */
    @media (orientation: portrait), (max-width: 600px) {
      .shaka-volume-bar-container {
        display: none !important; /* Hide wide volume slider on narrow screens */
      }
      .shaka-current-time {
        font-size: 11px !important;
      }
      .shaka-controls-button-panel > * {
        margin: 0 2px !important;
      }
    }
  </style>
</head>
<body>

             style="width:100%; height:100%; object-fit: contain;"></video>

  <script>
    (function() {
      const FIT_ICON = <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 3H3v2h2V3zm0 16H3v2h2v-2zm14-16h2v2h-2V3zm0 16h2v2h-2v-2zM7 7h10v10H7V7z" fill="currentColor"/><path d="M9 9h6v6H9V9z" fill="currentColor"/></svg>;
      const STRETCH_ICON = <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 8V3h5v2H5v3H3zm0 8v5h5v-2H5v-3H3zm18-8V3h-5v2h3v3h2zm0 8v5h-5v-2h3v-3h2z" fill="currentColor"/><path d="M8 8h8v8H8z" fill="currentColor"/><path d="M10 10h4v4h-4z" fill="currentColor"/></svg>;
[07-11-2026 01:47] Web Wala.. : ): const FULL_ICON = <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 3C5.686 3 3 5.686 3 9s2.686 6 6 6 6-2.686 6-6-2.686-6-6-6zm0 10c-2.206 0-4-1.794-4-4s1.794-4 4-4 4 1.794 4 4-1.794 4-4 4z" fill="currentColor"/><path d="M15.5 15.5l4 4" stroke="currentColor" stroke-width="2" fill="none"/><rect x="7" y="7" width="4" height="4" rx="1" fill="currentColor"/></svg>;

      async function init() {
        const video = document.getElementById('video');
        const ui = video.ui;
        const controls = ui.getControls();
        const player = controls.getPlayer();

        player.configure({
          drm: {
            clearKeys: {
              "952fb91696308da86bee7cd24edf0b58":"bf359214ab3ac848738bdf014ace21b3"  
            }
          }
        });

        ui.configure({
          controlPanelElements: [
            "play_pause", "mute", "volume", "spacer", 
            "time_and_duration", "quality", "fullscreen"
          ],
          fadeDelay: 3, // Auto-hides after 3 seconds of inactivity
          singleClickForPlayAndPause: false, // Ensures tap wakes UI on mobile
          volumeBarColors: {
            base: "rgba(0, 0, 255, 1)",
            level: "rgb(0, 255, 0)"
          },
          seekBarColors: {
            base: "rgb(255, 0, 0)",
            buffered: "rgb(255, 255, 0)",
            played: "rgba(0, 128, 128, 1)"
          }
        });

        window.player = player;
        window.ui = ui;

        player.addEventListener("error", onPlayerErrorEvent);
        controls.addEventListener("error", onUIErrorEvent);

        try {
          await player.load("https://otte.live.fly.ww.aiv-cdn.net/iad-nitro/live/clients/dash/enc/ppmrp8tlzz/out/v1/cf829370483b4212ac7d5e3009c514b1/cenc.mpd");
        } catch (error) {
          onPlayerError(error);
        }

        setTimeout(() => {
          insertCustomViewButton(controls, ui);
        }, 150);
      }

      function insertCustomViewButton(controls, ui) {
        const buttonPanel = document.querySelector('.shaka-controls-button-panel');
        if (!buttonPanel) {
          setTimeout(() => insertCustomViewButton(controls, ui), 200);
          return;
        }
        if (document.querySelector('.custom-fit-button')) return;

        const fullscreenBtn = buttonPanel.querySelector('.shaka-fullscreen-button');
        const customBtn = document.createElement('button');
        customBtn.className = 'custom-fit-button';
        customBtn.setAttribute('aria-label', 'Toggle view mode');
        customBtn.title = 'Fit';

        const video = document.getElementById('video');
        let viewState = 0; 
        const icons = [FIT_ICON, STRETCH_ICON, FULL_ICON];
        const titles = ['Fit', 'Stretch', 'Full'];
        const objectFits = ['contain', 'fill', 'cover'];

        function updateView(state) {
          customBtn.innerHTML = icons[state];
          customBtn.title = titles[state];
          video.style.objectFit = objectFits[state];
        }

        updateView(0);

        customBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          viewState = (viewState + 1) % 3;
          updateView(viewState);
        });

        if (fullscreenBtn) {
          buttonPanel.insertBefore(customBtn, fullscreenBtn);
        } else {
          buttonPanel.appendChild(customBtn);
        }
      }

      function onPlayerErrorEvent(event) {
        onPlayerError(event.detail);
      }
      function onPlayerError(error) {
        console.error("Error code", error.code, "object", error);
      }
      function onUIErrorEvent(event) {
        onPlayerError(event.detail);
      }
      function initFailed() {
        console.error("Unable to load the UI library!");
      }

      document.addEventListener("shaka-ui-loaded", init);
      document.addEventListener("shaka-ui-load-failed", initFailed);
    })();
  </script>
</body>
